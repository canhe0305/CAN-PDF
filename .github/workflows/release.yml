name: Release CAN PDF Desktop (Windows & macOS)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CAN PDF frontend
        working-directory: frontend
        run: npm run build:cans

      - name: Build Tauri Desktop bundles
        working-directory: src-tauri
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }}

      - name: Publish Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: CAN PDF ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          body: |
            ### CAN PDF 桌面客户端 (Windows & macOS)

            - **Windows (64-bit)**: 下载 `.msi` 或 `-setup.exe` 安装包直接安装。
            - **macOS (Apple Silicon M1/M2/M3/M4)**: 下载 `_aarch64.dmg` 双击安装。
            - **macOS (Intel)**: 下载 `_x64.dmg` 双击安装。

            > **macOS 提示**：首次打开若提示“无法验证开发者”，请在访达（Finder）中**右键点击 CAN PDF → 打开**即可。
          draft: false
          prerelease: false
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
