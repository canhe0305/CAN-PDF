name: Release CAN PDF Desktop (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts

      - name: Build CAN PDF frontend
        run: |
          cd frontend
          npm run build:cans

      - name: Build Tauri Desktop and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || 'v0.1.0' }}
          releaseName: 'CAN PDF Desktop ${{ github.ref_name || 'v0.1.0' }}'
          releaseBody: |
            ### CAN PDF 现代化纯净 PDF 工作区

            - **Windows**: 下载 `.exe` 或安装包直接运行。
            - **Mac (Apple Silicon M1/M2/M3/M4)**: 下载 `...aarch64.dmg` 双击安装。
            - **Mac (Intel)**: 下载 `...x86_64.dmg` 双击安装。
            
            纯净离线，零外部运行时依赖，沉浸式极简无边框体验。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './src-tauri'
